[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolform"
dynamic = ["version"]
description = "Tool interfaces for LLM agents, chosen by measurement: recommend, render, parse and guard the tool block from a study of 129 formats, 31 answer protocols and 112 models."
readme = "README_PYPI.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Gaurav Srivastava", email = "gks@vt.edu" }]
maintainers = [{ name = "Gaurav Srivastava", email = "gks@vt.edu" }]
keywords = ["llm", "agents", "tool-calling", "function-calling", "mcp", "json-schema", "prompt-format", "tool-use"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]
embeddings = ["sentence-transformers>=3.0"]          # embedding retrieval for long catalogues
tokenizers = ["transformers>=4.45"]                   # exact token counts with a model's own tokenizer
all = ["toolform[serve,embeddings,tokenizers]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.0",
    "jsonschema>=4.20",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://ctrl-gaurav.github.io/toolform/"
Documentation = "https://ctrl-gaurav.github.io/toolform/docs/"
Repository = "https://github.com/ctrl-gaurav/toolform"
Issues = "https://github.com/ctrl-gaurav/toolform/issues"
Changelog = "https://github.com/ctrl-gaurav/toolform/blob/main/CHANGELOG.md"

[project.scripts]
toolform = "toolform.app.cli:main"

[tool.setuptools.dynamic]
version = { attr = "toolform.sdk.constants.FRAMEWORK_VERSION" }

[tool.setuptools.packages.find]
include = ["toolform*"]

[tool.setuptools.package-data]
toolform = ["py.typed", "**/*.yaml", "**/*.json", "**/*.html", "**/*.css", "**/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["toolform"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# typer reads typing.Optional/List annotations; quoted forward references are kept for Python 3.10.
ignore = ["UP006", "UP035", "UP037", "UP045"]

[tool.ruff.lint.flake8-bugbear]
# typer and FastAPI declare options and parameters as calls in default arguments.
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Query", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
# a LaTeX table row kept verbatim inside a test string
"tests/test_advisor_texparse.py" = ["E501"]
