    <script>
      // Set the theme before first paint so there is no flash of the wrong one.
      // Dark is the default; a saved choice wins.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("toolform-theme");
        } catch (e) {}
        document.documentElement.dataset.theme = saved === "light" || saved === "dark" ? saved : "dark";
      })();
    </script>
