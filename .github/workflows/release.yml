# Release: build and publish to PyPI when a version tag (v*) is pushed, with PyPI trusted publishing
# (configure the "pypi" environment and the trusted publisher on pypi.org first).
#
# Runs on demand; uncomment the tag trigger below to publish on every version tag.
name: Release

on:
  workflow_dispatch:
  # push:
  #   tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
