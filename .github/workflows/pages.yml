# Website and documentation on GitHub Pages: the landing site at /toolform/, the docs at /toolform/docs/.
#
# Deploys on every push to main that changes the site, the docs or this workflow (Settings -> Pages ->
# Source must be "GitHub Actions"), and can be started by hand.
name: Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["website/**", "docs/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd website && npm ci && npm run build
      - run: cd docs && npm ci && npm run build
      - name: Combine the site and the docs
        run: |
          mkdir -p _site/docs
          cp -r website/dist/* _site/
          cp -r docs/.vitepress/dist/* _site/docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
